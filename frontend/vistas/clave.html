<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador</title>
    <link rel="stylesheet" href="/frontend/styles/admin.css">
    <style>
        .login-wrapper {
            max-width: 380px;
            margin: 4rem auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 2rem;
        }
        .login-wrapper h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            margin-bottom: .3rem;
        }
        .login-wrapper p {
            color: var(--text-2);
            font-size: .9rem;
            margin-bottom: 1.5rem;
        }
        .login-error {
            display: none;
            background: #FDECEC;
            color: #B3261E;
            border-radius: var(--radius-sm);
            padding: .6rem .8rem;
            font-size: .85rem;
            margin-bottom: 1rem;
        }
        .login-error.visible { display: block; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <h1>Acceso Administrador</h1>
    <p>Ingresá tus credenciales de administrador para continuar.</p>

    <div class="login-error" id="loginError"></div>

    <form id="claveForm">
        <div class="form-group">
            <label for="gmail">Correo</label>
            <input type="email" id="gmail" placeholder="tu@email.com" required>
        </div>
        <div class="form-group" style="margin-top: .8rem;">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div class="form-actions" style="margin-top: 1.2rem;">
            <a href="index.html" class="btn btn-ghost">Volver</a>
            <button type="submit" class="btn btn-primary" id="btnIngresar">Ingresar</button>
        </div>
    </form>
</div>

<script src="/frontend/pages/clave.js"></script>
</body>
</html>
